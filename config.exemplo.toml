# Configuração de exemplo do HugeSyslogs.
# Copie para config.toml e ajuste conforme o teste desejado.

[teste]
duracao          = "60s"   # tempo de execução dos geradores
aquecimento      = "5s"    # descartado das métricas
drenagem         = "10s"   # espera após parar os geradores, para a fila do relay esvaziar
tamanho_mensagem = 512     # bytes por mensagem (frame syslog, sem o \n do TCP)
taxa             = 50000   # msgs/s TOTAL, repartido entre os geradores pelos pesos
threads          = 4       # threads por gerador (padrão, sobrescrevível por gerador)
total_mensagens  = 0       # 0 = ilimitado, usa "duracao"

[relay]
tamanho_fila    = 100000
workers_fila    = 1        # > 1 costuma distorcer o round-robin
rebind_interval = 0        # 0 = desliga a reconexão periódica do omfwd

[receptores]
quantidade = 4

[tls]
# anon      -> criptografa sem verificar nada, nenhum certificado em lugar algum
# certvalid -> receptores apresentam um certificado self-signed e o relay valida
#              apenas a cadeia (não o nome). Plano B caso o build de GnuTLS
#              não ofereça ciphersuites anônimas.
modo = "anon"

# ---- Geradores: um bloco = um container ----
# Os pesos são normalizados pela soma, então não precisam fechar em 100.

[[gerador]]
nome  = "A"
proto = "udp"
peso  = 90

[[gerador]]
nome  = "B"
proto = "tcp"
peso  = 3

[[gerador]]
nome  = "C"
proto = "udp"
peso  = 1

[[gerador]]
nome  = "D"
proto = "udp"
peso  = 6
# Sobrescritas opcionais por gerador:
# threads          = 8
# tamanho_mensagem = 2048
# taxa             = 12000   # taxa absoluta; quando presente, o peso é ignorado

[saida]
diretorio = "./resultados"
formato   = "tabela"   # tabela | json | ambos
